# APL masking plan — guided_curated_p0（保戶自行宣告，非自動偵測）
# 對應痛點 3：病歷調閱範圍常被質疑「超出本次理賠所需」（個資法比例原則）。
# 這份計畫用「揭露最小化」把爭議變成一份可驗證的收據。
task_type: medical_claim

# 這些欄位的「值」不得出現在任何送給外部方（保險公司/審核/詐欺偵測）的內容中
local_only_fields:
  - national_id            # 身分證字號
  - contact_info           # 地址 / 電話 / Email
  - unrelated_history      # 與本次理賠無關的病史：精神科、B肝、痔瘡、家族史、長期用藥
  - full_policy_numbers    # 完整保單號碼

# 為了讓理賠審核仍然可用，刻意「保留」的抽象任務訊號（最小必要集）
preserved_task_signals:
  - 本次住院診斷代碼（ICD-10: K81.0）
  - 住院與出院日期（2026-08-10 ~ 2026-08-15，共 5 日）
  - 手術名稱與代碼（腹腔鏡膽囊切除術 / 51.23）
  - 醫療費用金額（住院 48,000 + 手術 37,000 = 85,000）
  - 保單給付項目「類別」（住院日額 / 實支實付 / 手術定額），不含完整保單號

# 兩個外部方各自只看到不同的最小切片 → 沒有任何單一方看到完整卷宗
payload_routing:
  mock_provider_a: >-
    理賠審核方 — 只收本次理賠必要的診斷/日期/手術/金額/給付類別，
    據以判斷可理賠項目與缺件清單。
  mock_provider_b: >-
    詐欺風險偵測方 — 只收去識別化的樣態訊號（金額級距、手術代碼、住院天數、
    診斷-手術一致性），完全不含身分、病史或保單資訊。
